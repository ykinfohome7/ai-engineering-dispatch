[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bgdb-ai-emds"
version = "0.1.0"
description = "BGDB AI Engineering Management & Dispatch System bridge to Paperclip"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
readme = "README.md"
dependencies = []

[project.scripts]
bgdb-dispatch = "bgdb_dispatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
