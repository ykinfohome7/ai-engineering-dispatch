name: BGDB AI-EMDS CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout including Paperclip submodule
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: Secret-pattern guard
        shell: bash
        run: |
          # Проверява файловете на проекта, без да сканира външния submodule.
          if grep -RInIE --exclude=ci.yml --exclude-dir=.git --exclude-dir=paperclip \
            -e '-----BEGIN (OPENSSH |RSA |EC )?PRIVATE KEY-----' \
            -e 'ghp_[A-Za-z0-9]{12,}' \
            -e 'sk-[A-Za-z0-9]{12,}' .; then
            echo 'Potential credential material found' >&2
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest and YAML lint
        run: python3 -m pip install --disable-pip-version-check pytest yamllint
      - name: Run Python tests with pytest
        env:
          PYTHONPATH: src
        run: python3 -m pytest tests/ -q
      - name: ShellCheck scripts and infrastructure
        shell: bash
        run: |
          # Проверява shell скриптовете статично.
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          # Проверява всички останали скриптове без изключения.
          find scripts infra -type f -name '*.sh' ! -path 'infra/postgres/backup.sh' -print0 |
            xargs -0 shellcheck --severity=warning
          # Единствено старият backup.sh има познат SC2174 за mkdir -p -m.
          shellcheck --severity=warning --exclude=SC2174 infra/postgres/backup.sh
      - name: YAML lint configuration and GitHub files
        shell: bash
        run: |
          # Проверява YAML файловете без да изпълнява команди от тях.
          find config .github -type f -name '*.yml' -print0 > /tmp/bgdb-yaml-files
          find config .github -type f -name '*.yaml' -print0 >> /tmp/bgdb-yaml-files
          xargs -0 -a /tmp/bgdb-yaml-files yamllint -d '{extends: relaxed, rules: {line-length: disable, document-start: disable, truthy: disable}}'
      - name: Validate Codespaces JSON
        run: python3 -m json.tool .devcontainer/devcontainer.json > /dev/null
